<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動化科展學術報告生成器</title>
    <!-- 引入 docx 下載套件 -->
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 30px 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 35%, #0284c7 70%, #0369a1 100%);
            background-attachment: fixed;
            color: #1e293b;
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 控制面板卡片 */
        .control-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .control-card h1 {
            font-size: 1.6rem;
            color: #0369a1;
            margin-top: 0;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #334155;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        textarea.form-control {
            height: 100px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        .btn-success {
            background-color: #10b981;
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        /* 報告渲染卡片 */
        .report-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }

        /* 封面排版 */
        .cover-page {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px dashed #cbd5e1;
            margin-bottom: 40px;
        }

        .cover-title {
            font-size: 2rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 30px;
        }

        .cover-meta {
            font-size: 1.05rem;
            line-height: 2;
            color: #334155;
        }

        h2 {
            font-size: 1.4rem;
            color: #0369a1;
            border-bottom: 2px solid #bae6fd;
            padding-bottom: 8px;
            margin-top: 36px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.85;
            text-indent: 2em;
            text-align: justify;
            margin-bottom: 16px;
        }

        /* 讓生成的內容可直接在畫面上點擊編輯 */
        [contenteditable="true"]:hover {
            outline: 2px dashed #38bdf8;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 輸入與互動設定區域 -->
        <div class="control-card">
            <h1>⚙️ 科展作業報告自動生成器 (依照 AGENTS.md 規範)</h1>
            
            <div class="form-group">
                <label for="topic">報告主題：</label>
                <input type="text" id="topic" class="form-control" placeholder="例如：醫療大數據在智慧醫院的應用">
            </div>

            <div class="form-group">
                <label for="author">作者姓名與系級：</label>
                <input type="text" id="author" class="form-control" value="中國醫藥大學 醫療資訊學系 張小明 (115000000)">
            </div>

            <div class="form-group">
                <label for="references">參考文獻 / 補充資料（貼上相關資料）：</label>
                <textarea id="references" class="form-control" placeholder="請貼上相關文獻摘要或數據..."></textarea>
            </div>

            <div class="form-group">
                <label for="api-key">Groq / OpenRouter API Key (可選，有 Key 可即時調用 AI 生成)：</label>
                <input type="password" id="api-key" class="form-control" placeholder="gsk_...（留空將以 AGENTS.md 結構範本生成）">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateReport()">🚀 自動生成標準報告</button>
                <button class="btn btn-success" onclick="exportWord()">📥 下載 Word 檔 (.docx)</button>
            </div>
        </div>

        <!-- 成果展示區 (支援線上點擊直接修改編輯) -->
        <div class="report-card" id="report-content" contenteditable="true">
            <div class="cover-page">
                <div class="cover-title" id="out-title">請在上方輸入主題並點擊生成報告</div>
                <div class="cover-meta">
                    <p style="text-indent:0;" id="out-author"><strong>作者資訊：</strong>請輸入作者姓名</p>
                    <p style="text-indent:0;"><strong>規範標準：</strong>AGENTS.md 全國科展/學術標準</p>
                    <p style="text-indent:0;" id="out-date"><strong>完成日期：</strong>2026 年 11 月 16 日</p>
                </div>
            </div>

            <div id="report-body">
                <p style="text-indent:0; text-align:center; color:#64748b;">( 點擊上方「自動生成標準報告」按鈕後，此處將依據大寫數字標題與首行縮排規範動態輸出報告內容，生成後您亦可直接在此處點擊編輯文字 )</p>
            </div>
        </div>

    </div>

    <script>
        async function generateReport() {
            const topic = document.getElementById('topic').value || "智慧醫療與 AI 自動化架構研究";
            const author = document.getElementById('author').value || "中國醫藥大學 醫療資訊學系";
            const refs = document.getElementById('references').value || "無附加文獻";
            const apiKey = document.getElementById('api-key').value.trim();

            document.getElementById('out-title').innerText = topic;
            document.getElementById('out-author').innerHTML = `<strong>作者資訊：</strong>${author}`;
            
            const bodyDiv = document.getElementById('report-body');
            bodyDiv.innerHTML = "<p style='text-indent:0;'>⏳ 正在依據 AGENTS.md 規範建構學術報告中，請稍候...</p>";

            if (apiKey) {
                // 如果使用者有輸入 Groq API Key，直接呼叫 AI 動態生成
                try {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [
                                {
                                    role: "system",
                                    content: "你是一名科展與學術報告專家。請嚴格依據 AGENTS.md 規範撰寫報告 HTML 內容。大標題必須使用 HTML <h2> 並用大寫中文數字（壹、摘要與目錄 貳、研究動機與目的 參、研究過程與方法 肆、研究結果與討論 伍、參考資料）。正文使用 <p> 標籤。語法要嚴謹、無 AI 罐頭感、文字流暢。不要輸出 ```html 標籤，直接給 HTML 內文。"
                                },
                                {
                                    role: "user",
                                    content: `主題：${topic}\n參考資料：${refs}`
                                }
                            ]
                        })
                    });
                    const data = await response.json();
                    let htmlContent = data.choices[0].message.content;
                    bodyDiv.innerHTML = htmlContent;
                    return;
                } catch (e) {
                    alert("API 呼叫失敗，轉為內建結構化引擎生成。");
                }
            }

            // 無 API Key 時的動態模板生成邏輯 (確保符合大寫數字與全形縮排)
            setTimeout(() => {
                bodyDiv.innerHTML = `
                    <h2>壹、 摘要與目錄</h2>
                    <p>本研究旨在探討「${topic}」之核心架構與實務應用。透過結構化之資料彙整與學術規範，系統性地解析相關文獻：${refs.substring(0, 50)}...。傳統報告撰寫過程耗時，本專案透過定型化之規範文件（AGENTS.md），強制約束生成內容之語法結構、段落縮排與條列階層，進而大幅提升學術文件生成之品質與生產力。</p>

                    <h2>貳、 研究動機與目的</h2>
                    <p>在當前學術研究環境中，關於「${topic}」的規範性與研究效率一直是重要課題。科展與學術期刊對於內文縮排、大綱階層與文風客觀性皆有嚴格標準。本研究旨在去除非必要的機械化過渡詞，採用大專生應有的嚴謹筆調，精準產出高品質之研究報告。</p>

                    <h2>參、 研究過程與方法</h2>
                    <p>本專案之實作過程分為架構設計、規範制定與系統驗證三大部分，細部執行步驟如下：</p>

                    <h2>肆、 研究結果、討論與心得</h2>
                    <p>經實測表明，透過導入明確之 AGENTS.md 規範，產出內容邏輯鏈結更加緊密。在學習生成式 AI 的過程中，我們深刻體會到「給予明確邊界」的重要性，建構出可重用且可延伸的自動化開發流程。</p>

                    <h2>伍、 參考資料</h2>
                    <p style="text-indent: 0;">1. 學術文獻參考資料 (2026)。<i>${topic}相關研究期刊</i>。</p>
                    <p style="text-indent: 0;">2. 參考資料輸入：${refs.substring(0, 30)}</p>
                `;
            }, 500);
        }

        // 匯出 Word 檔
        function exportWord() {
            var content = document.getElementById('report-content').innerHTML;
            var html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='[http://www.w3.org/TR/REC-html40](http://www.w3.org/TR/REC-html40)'><head><meta charset='utf-8'><title>Export Word</title></head><body>" + content + "</body></html>";
            
            var blob = htmlDocx.asBlob(html);
            saveAs(blob, "科展標準作業報告.docx");
        }
    </script>
</body>
</html>
